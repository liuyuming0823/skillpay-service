# SkillPay 反向代理配置
# 安装位置：/etc/nginx/sites-available/skillpay
# 启用：     ln -sf /etc/nginx/sites-available/skillpay /etc/nginx/sites-enabled/skillpay
#            rm -f /etc/nginx/sites-enabled/default
#            nginx -t && systemctl reload nginx

upstream skillpay_backend {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/skillpay.access.log;
    error_log  /var/log/nginx/skillpay.error.log;

    client_max_body_size 1m;

    # 402 账单里的金额、时间与 RSA2 签名依赖完整透传，不做改写
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    location / {
        proxy_pass http://skillpay_backend;
    }

    location = /healthz {
        proxy_pass http://skillpay_backend/healthz;
        access_log off;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS 块 —— 这是「能不能收到钱」的分界线，不是可选优化
#
# ⚠️ 资源地址必须是 HTTPS。支付宝官方 CLI（alipay-bot）会直接拒绝 HTTP 资源地址：
#      Error: paid resource URL must use HTTPS
#    只跑上面那个 80 端口的块，账单能签发，但买家生成不出支付入口，等于收不到钱。
#
# 两条路，选一条：
#   A. 还没有域名：先用 Cloudflare 隧道当天拿到 HTTPS，本文件可以不动
#      setsid nohup cloudflared tunnel --url http://127.0.0.1:18080 > ~/cf.log 2>&1 < /dev/null &
#      详见 docs/接入教程.md 第 5.7 节
#   B. 已有域名与证书：取消下面注释并启用
#      1) 证书放到 /etc/nginx/ssl/skillpay.crt 与 /etc/nginx/ssl/skillpay.key
#      2) 把 server_name 改成你的域名
#      3) nginx -t && systemctl reload nginx
#
# 上 HTTPS 之后，记得把新地址同步回技能（SKILL.md 商品表 + 客户端脚本默认地址），
# 否则买家打出去的还是旧地址。详见 docs/接入教程.md 第 5.8 节。
#
# 注意：nginx 为 1.18 时，TLS 需写在 listen 行内，不支持新式 "http2 on;"
